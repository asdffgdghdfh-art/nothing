name: SmartBackup cross-platform builds

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smartbackup-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Run automated tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee npm-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SmartBackup-Linux-test-log
          path: npm-test.log
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: Windows x64 portable build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: SmartBackup-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS Apple Silicon ARM64 build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          node -p "process.arch"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run pack:mac
      - uses: actions/upload-artifact@v4
        with:
          name: SmartBackup-macOS-ARM64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android OTG APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SmartBackup-Android-OTG
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
